[package]
name = "ml_simulation_3d"
version = "0.1.0"
edition = "2021"
description = "A 3D physics-simulated person that learns to walk with neural networks and evolution strategies"

[dependencies]
macroquad = "0.4"
rapier3d = "0.36.1"

# Keep debug builds playable: optimize dependencies fully and our own code a bit.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
