[package]
name = "ml_simulation_3d"
version = "0.1.0"
edition = "2021"
description = "3D underwater ecosystem where neural-network creatures evolve by natural selection"

[dependencies]
macroquad = "0.4"

# Keep debug builds playable: optimize dependencies fully and our own code a bit.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
