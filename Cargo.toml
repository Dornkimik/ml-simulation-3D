[package]
name = "ml_simulation_3d"
version = "0.1.0"
edition = "2021"
description = "Two 3D players learn to play soccer against each other with neural networks and evolution strategies"

[dependencies]
macroquad = "0.4"
# Native open/save dialogs for importing and exporting brains.
rfd = "0.17"

# Keep debug builds playable: optimize dependencies fully and our own code a bit.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
